---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: server-os
description: My lightly modified version ublue ucore.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/ucore
image-version: stable

# module configuration, executed in order
modules:

  - type: dnf
    install:
      packages:
        - cronie # scheduled executions
        - wget # downloading files
        - ffmpeg # for video manipulation
        - vim # a sane file editor
        - ruby # running the discord bot
        - java-25-openjdk-headless # running minecraft server

  - type: script
    scripts:
      - starship.sh # starship bash prompt

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
